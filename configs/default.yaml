# ── Project ──────────────────────────────────────────
project_name: unified-space-debris-detection
seed: 42

# ── Data ─────────────────────────────────────────────
data:
  raw_dir: data/raw
  processed_dir: data/processed
  simulated_dir: data/simulated
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10

# ── Radar simulation ─────────────────────────────────
radar:
  frequency_ghz: 1.33          # TIRA L-band
  peak_power_w: 1500000        # 1.5 MW
  antenna_gain_db: 49.7
  pulse_width_ms: 1.0
  prf_hz: 25
  n_pulses: 100
  sample_rate_khz: 5
  range_bins: 200
  doppler_bins: 100
  min_range_km: 300
  max_range_km: 2000
  noise_figure_db: 2.0
  debris_diameters_cm: [0.5, 1.0, 2.0, 4.0, 8.0]

# ── Training ─────────────────────────────────────────
training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  early_stopping_patience: 15
  gradient_clip: 1.0

# ── Models ───────────────────────────────────────────
models:
  catalog_classifier:
    hidden_layers: [256, 128, 64]
    dropout: 0.3
    lstm_units: 128
    cnn_filters: [32, 64, 128]

  radar_detector:
    yolo_version: v8
    yolo_size: nano          # n / s / m / l / x
    input_size: [640, 640]
    conf_threshold: 0.25
    iou_threshold: 0.45

# ── Evaluation ───────────────────────────────────────
evaluation:
  pfa_values: [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
  confidence_levels: [0.001, 0.25, 0.50, 0.75, 0.90]
  target_tpr_at_fpr: 0.95     # TPR target when FPR = 1e-5
  target_accuracy: 0.995      # classification accuracy target
