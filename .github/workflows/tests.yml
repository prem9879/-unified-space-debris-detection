name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install UI test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run tests
        run: |
          pytest --cov=src --cov-report=xml
      - name: Run UI smoke tests
        run: |
          npm run test:ui
      - name: Generate calibration/eval artifacts
        run: |
          python scripts/generate_ci_reports.py
          python scripts/generate_security_policy.py
          python scripts/generate_slo_report.py
          python scripts/build_hard_negative_index.py --dataset_root data --output artifacts/reports/hard_negative_index.json
          python scripts/generate_readiness_pack.py
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calibration-eval-reports
          path: |
            artifacts/reports/*.json
      - name: Upload Playwright artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/playwright-report
