apiVersion: apps/v1
kind: Deployment
metadata:
  name: debris-api
  namespace: debris-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: debris-api
  template:
    metadata:
      labels:
        app: debris-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/debris-api:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: debris-api
  namespace: debris-prod
spec:
  selector:
    app: debris-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: debris-api-hpa
  namespace: debris-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: debris-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
